[project]
name = "cinemania"
version = "0.1.0"
description = "Cinemania IMDb Review Sentiment Classification comparing a custom PyTorch SentimentRNN and fine-tuned DistilBERT."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "accelerate>=1.0.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
cinemania-experiment = "cinemania.run_experiment:main"
cinemania-predict = "cinemania.inference.predict:main"
cinemania-viz = "cinemania.visualizer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cinemania"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
